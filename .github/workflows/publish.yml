name: Publish

# Two things come out of a tagged version: the modules, published to GitHub Packages for anything that
# wants to build against the api; and jedrock.jar, attached to the release for anyone who just wants to
# run a server. Both from one build, so they can never disagree about what they are.
#
# Triggered by publishing a release, or by hand from the Actions tab. Not by every push: a package
# registry that gets a new version per commit is a registry nobody can pick a version out of.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the jar to the release
      packages: write   # publish the modules

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Writes the settings.xml that maps the pom's <id>github</id> to the credentials below.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Build and test
        # Everything is built and tested BEFORE anything is published, and that split is the whole point.
        # Maven runs its lifecycle per module, so a single `deploy` publishes each module as it finishes —
        # which means a test failing in the last module leaves the first five in the registry. GitHub
        # Packages refuses to overwrite a published version, so that half-release is permanent: the retry
        # fails with 409 on the artifact the previous attempt already uploaded, and the only way out is
        # deleting versions by hand.
        run: mvn -B --no-transfer-progress verify

      - name: Publish to GitHub Packages
        # Nothing is re-tested here — the artifacts are the ones that just passed, and the repackage is
        # incremental. This step only ever runs when the whole reactor is already known to be good.
        run: mvn -B --no-transfer-progress deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the runnable server to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: jedrock.jar
