# Jedrock server configuration.
#
# Written automatically on first run; edit and restart to apply. Every key has a default, so a key you
# delete keeps its built-in value and a bad value falls back to it with a warning instead of failing to
# start. Any key can also be overridden at launch with -Dkey=value (e.g. -Dserver.port.je=25566).
#
# This is the file you edit to run a server. The wire's own settings — threads, socket options, view
# radius caps, packet guards — live in pipeline.yml beside it.

# ===== Server =====
# Human-readable name and the message-of-the-day shown in the server list.
server.name=Jedrock
server.motd=Jedrock

# Address to bind every listener to. 0.0.0.0 = all interfaces.
server.bind=0.0.0.0

# Listener ports. Java Edition is TCP; Bedrock is UDP (RakNet).
server.port.je=25565
server.port.pe=19132

# Experimental MCPE 0.14 (protocol 45) listener. It speaks a different RakNet version than 1.1.5,
# so it needs its own UDP port. Set pe014.enabled=false to turn it off; a bind failure here (e.g.
# the port is already in use) is non-fatal and never stops the Java / 1.1.5 listeners.
server.port.pe014=19133
pe014.enabled=true

# Advertised player cap (server-list ping + Java Join Game).
server.max-players=20

# ===== Folders =====
# Where the server keeps its things, relative to where it was started (an absolute path works too, which
# is how a world goes on another disk). They are created on first run, and an older flat install — worlds
# and ops.txt sitting beside the jar — is migrated into them automatically.
#
# These two files are NOT movable: jedrock.properties and pipeline.yml are how you say where everything
# else is, so they have to be somewhere already known.
paths.worlds=worlds
paths.plugins=plugins
paths.logs=logs
paths.data=data

# ===== World =====
# Generation seed. Blank = the built-in default (stable terrain across restarts);
# 'random' = a fresh random world; a number is used as-is; any other text is hashed
# to a seed (the same rule Minecraft uses).
world.seed=

# The world players join into, and the folder it lives in (worlds/<name>).
world.default-name=world

# The recipe it is created from — the very FIRST time only. After that the world exists on disk and its
# terrain is the file's, not this key's; changing it later renames nothing and regenerates nothing.
# Built in: overworld, nether, overworld_small, nether_small, bare. Scripts can register more.
world.default-template=overworld

# Whether the other world folders are loaded at boot. false = only the default world comes up, and
# anything else has to be loaded deliberately (a script, or a command).
world.load-all=true

# How often (seconds) a changed world is written to disk — along with scenes, regions and script storage.
# 0 turns autosave off entirely, leaving the save on shutdown as the only one. A clean world is skipped
# either way, and the write runs off the game loop so it never stalls a tick.
world.autosave-seconds=300

# ===== Game =====
# Loop rate in ticks per second. 20 is vanilla.
game.tick-rate=20

# Chunk streaming radius (in chunks) around each player. Bedrock caps this per era in pipeline.yml.
game.view-distance=6

# Game mode a player joins in. Accepts a name (survival / creative / adventure / spectator), a
# shorthand (s / c / a / sp) or an id (0-3). In survival the client shows health/hunger and can't
# fly; flight is allowed in creative. Players with permission can switch live with /gamemode.
game.default-gamemode=creative

# ===== Players =====
# Whether a player rejoins the world they were last in, instead of always the default one. Only the
# world is remembered, not the spot in it: they arrive at that world's spawn. Recorded in
# data/player-worlds.txt the moment someone crosses between worlds, so a player who never left the
# default one has no entry at all — and an entry naming a world that is no longer there falls back to
# the default. Set to false and everyone joins into the default world, wherever they logged out.
player.remember-world=true

# ===== Plugins =====
# The scripting layer: *.js in the plugins folder, loaded at boot.
plugins.enabled=true

# Whether a saved edit is picked up without a restart, and how often (milliseconds) the folder is polled
# for one. The poll runs on its own thread — it blocks on disk I/O and has no business on the game loop.
plugins.hot-reload=true
plugins.reload-millis=1000

# ===== Storage =====
# Where the server keeps its small persistent facts (today: which world each player was last in).
#
# 'flatfile' is the default and writes the same key=value files in data/ the server has always used —
# a few kilobytes, editable in any text editor, nothing to run. 'jdbc' is for anyone who would rather
# they lived in a database: a network of servers sharing one account of who is where, or a host that
# already has one.
#
# NO DRIVER IS BUNDLED — that is what keeps this jar small for everyone who doesn't want a database.
# Drop the driver jar in libs/ beside the server and name its class below. For SQLite that is
# sqlite-jdbc (org.xerial); for MySQL, mysql-connector-j with driver=com.mysql.cj.jdbc.Driver.
#
# A backend that can't be opened — driver missing, database down, typo in the url — logs what to do
# about it and falls back to files. It never stops the server from starting.
storage.backend=flatfile
storage.url=jdbc:sqlite:data/jedrock.db
storage.driver=org.sqlite.JDBC
storage.user=
storage.password=

# ===== Remote console (RCON) =====
# The console surface over a socket, in the protocol every Minecraft management tool already speaks:
# stop, say, players, kick and every in-game command, run as an operator.
#
# Read this before turning it on. RCON is PLAINTEXT — the password and everything either side says
# cross the network in the clear, and anyone who reaches the port and guesses the password owns the
# server. So it binds 127.0.0.1 by default (use an SSH tunnel to reach it from elsewhere), and the
# listener REFUSES TO START with a blank password no matter what rcon.enabled says.
rcon.enabled=false
rcon.bind=127.0.0.1
rcon.port=25575
rcon.password=

# ===== Logging =====
# Whether console output is also written to logs/latest.log. On start the previous latest.log is renamed
# to the time it was last written to, so "the log" is always the same filename with the older runs beside
# it; keep-files says how many of those to keep (0 = none, just the current run).
logging.to-file=true
logging.keep-files=5

# Verbose logging. 'off', 'all', or a comma-separated list of logger-name tags to make noisy on their own
# (e.g. pe,chunk,keepalive). -Djedrock.debug on the command line overrides this.
logging.debug=off

# A one-line status (uptime, TPS, players) logged every N seconds. 0 = never.
logging.status-seconds=0

# ===== Anti-cheat: the "blind judge" =====
# Lazy validation instead of a physics engine. Generous by design — catches blatant reach and
# teleport/speed, not marginal cases. Set judge.enabled=false to turn it off entirely.
judge.enabled=true
# Max block-interaction distance (blocks) from the player; farther edits are rejected.
judge.max-reach=7.0
# Max position change (blocks) between two movement reports; larger jumps snap the player back.
judge.max-move-delta=16.0

# ===== Bedrock sidebar placement =====
# Bedrock has no scoreboard, so player.setSidebar() draws its panel in the HUD line above the hotbar
# (the field a held item's name uses). The client decides where that line goes; the only lever is the
# text itself, so the panel is nudged with padding. Both default to a placement clear of the hotbar;
# set either to 0 for the raw, centred position.
#
# Blank rows padded UNDER the panel — each one lifts it a line off the hotbar. A negative value pads
# above it instead (use that if a client anchors its popup the other way round).
pe.sidebar.raise=4
# Spaces padded on each row: positive shifts right, negative shifts left. The client centres the
# popup, so the panel moves by roughly HALF the spaces you add — 16 here is about 8 characters over.
pe.sidebar.shift=16
