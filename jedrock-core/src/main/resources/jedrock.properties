# Jedrock server configuration.
# Written automatically on first run; edit and restart to apply.
# Any key can also be overridden at launch with -Dkey=value (e.g. -Dserver.port.je=25566).

# ===== Server =====
# Human-readable name and the message-of-the-day shown in the server list.
server.name=Jedrock
server.motd=Jedrock

# Address to bind both listeners to. 0.0.0.0 = all interfaces.
server.bind=0.0.0.0

# Listener ports. Java Edition is TCP; Bedrock is UDP (RakNet).
server.port.je=25565
server.port.pe=19132

# Experimental MCPE 0.14 (protocol 45) listener. It speaks a different RakNet version than 1.1.5,
# so it needs its own UDP port. Set pe014.enabled=false to turn it off; a bind failure here (e.g.
# the port is already in use) is non-fatal and never stops the Java / 1.1.5 listeners.
server.port.pe014=19133
pe014.enabled=true

# Advertised player cap (server-list ping + Java Join Game).
server.max-players=20

# ===== World =====
# Generation seed. Blank = the built-in default (stable terrain across restarts);
# 'random' = a fresh random world; a number is used as-is; any other text is hashed
# to a seed (the same rule Minecraft uses).
world.seed=

# ===== Game =====
# Loop rate in ticks per second. 20 is vanilla.
game.tick-rate=20

# Chunk streaming radius (in chunks) around each player.
game.view-distance=6

# Game mode a player joins in. Accepts a name (survival / creative / adventure / spectator), a
# shorthand (s / c / a / sp) or an id (0-3). In survival the client shows health/hunger and can't
# fly; flight is allowed in creative. Players with permission can switch live with /gamemode.
game.default-gamemode=creative

# ===== Bedrock sidebar placement =====
# Bedrock has no scoreboard, so player.setSidebar() draws its panel in the HUD line above the hotbar
# (the field a held item's name uses). The client decides where that line goes; the only lever is the
# text itself, so the panel is nudged with padding. Both default to a placement clear of the hotbar;
# set either to 0 for the raw, centred position.
#
# Blank rows padded UNDER the panel — each one lifts it a line off the hotbar. A negative value pads
# above it instead (use that if a client anchors its popup the other way round).
pe.sidebar.raise=4
# Spaces padded on each row: positive shifts right, negative shifts left. The client centres the
# popup, so the panel moves by roughly HALF the spaces you add — 16 here is about 8 characters over.
pe.sidebar.shift=16

# ===== Anti-cheat: the "blind judge" =====
# Lazy validation instead of a physics engine. Generous by design — catches blatant reach and
# teleport/speed, not marginal cases. Set judge.enabled=false to turn it off entirely.
judge.enabled=true
# Max block-interaction distance (blocks) from the player; farther edits are rejected.
judge.max-reach=7.0
# Max position change (blocks) between two movement reports; larger jumps snap the player back.
judge.max-move-delta=16.0
