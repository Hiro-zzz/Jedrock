# Jedrock server configuration.
# Written automatically on first run; edit and restart to apply.
# Any key can also be overridden at launch with -Dkey=value (e.g. -Dserver.port.je=25566).

# ===== Server =====
# Human-readable name and the message-of-the-day shown in the server list.
server.name=Jedrock
server.motd=Jedrock

# Address to bind both listeners to. 0.0.0.0 = all interfaces.
server.bind=0.0.0.0

# Listener ports. Java Edition is TCP; Bedrock is UDP (RakNet).
server.port.je=25565
server.port.pe=19132

# Advertised player cap (server-list ping + Java Join Game).
server.max-players=20

# ===== World =====
# Generation seed. Blank = the built-in default (stable terrain across restarts);
# 'random' = a fresh random world; a number is used as-is; any other text is hashed
# to a seed (the same rule Minecraft uses).
world.seed=

# ===== Game =====
# Loop rate in ticks per second. 20 is vanilla.
game.tick-rate=20

# Chunk streaming radius (in chunks) around each player.
game.view-distance=6

# ===== Anti-cheat: the "blind judge" =====
# Lazy validation instead of a physics engine. Generous by design — catches blatant reach and
# teleport/speed, not marginal cases. Set judge.enabled=false to turn it off entirely.
judge.enabled=true
# Max block-interaction distance (blocks) from the player; farther edits are rejected.
judge.max-reach=7.0
# Max position change (blocks) between two movement reports; larger jumps snap the player back.
judge.max-move-delta=16.0
